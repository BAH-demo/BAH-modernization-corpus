---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: monolith-enterprise
  namespace: legacy-modernization
  labels:
    app: monolith-enterprise
    tier: legacy-modernization
    runtime: java
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: monolith-enterprise
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: monolith-enterprise
        tier: legacy-modernization
        runtime: java
    spec:
      serviceAccountName: monolith-enterprise
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: monolith-enterprise
          image: ghcr.io/bah-demo/monolith-enterprise:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: monolith-enterprise-config
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
