---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mezzanine
  namespace: legacy-modernization
  labels:
    app: mezzanine
    tier: legacy-modernization
    runtime: python
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: mezzanine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: mezzanine
        tier: legacy-modernization
        runtime: python
    spec:
      serviceAccountName: mezzanine
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: mezzanine
          image: ghcr.io/bah-demo/mezzanine:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: mezzanine-config
          resources:
            requests:
              cpu: "200m"
              memory: "256Mi"
            limits:
              cpu: "800m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
