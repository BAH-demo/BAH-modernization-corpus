---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: umbraco-cms
  namespace: legacy-modernization
  labels:
    app: umbraco-cms
    tier: legacy-modernization
    runtime: dotnet
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: umbraco-cms
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: umbraco-cms
        tier: legacy-modernization
        runtime: dotnet
    spec:
      serviceAccountName: umbraco-cms
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: umbraco-cms
          image: ghcr.io/bah-demo/umbraco-cms:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: umbraco-cms-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
