---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: b2cweb
  namespace: legacy-modernization
  labels:
    app: b2cweb
    tier: legacy-modernization
    runtime: java
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: b2cweb
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: b2cweb
        tier: legacy-modernization
        runtime: java
    spec:
      serviceAccountName: b2cweb
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: b2cweb
          image: ghcr.io/bah-demo/b2cweb:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: b2cweb-config
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "3Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
