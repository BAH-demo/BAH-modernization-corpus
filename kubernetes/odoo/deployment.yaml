---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: odoo
  namespace: legacy-modernization
  labels:
    app: odoo
    tier: legacy-modernization
    runtime: python
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: odoo
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: odoo
        tier: legacy-modernization
        runtime: python
    spec:
      serviceAccountName: odoo
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: odoo
          image: ghcr.io/bah-demo/odoo:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8069
              protocol: TCP
          envFrom:
            - configMapRef:
                name: odoo-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1500m"
              memory: "3Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
