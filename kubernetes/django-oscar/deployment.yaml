---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: django-oscar
  namespace: legacy-modernization
  labels:
    app: django-oscar
    tier: legacy-modernization
    runtime: python
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: django-oscar
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: django-oscar
        tier: legacy-modernization
        runtime: python
    spec:
      serviceAccountName: django-oscar
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: django-oscar
          image: ghcr.io/bah-demo/django-oscar:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: django-oscar-config
          resources:
            requests:
              cpu: "250m"
              memory: "256Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
