---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cfwheels
  namespace: legacy-modernization
  labels:
    app: cfwheels
    tier: legacy-modernization
    runtime: lucee
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: cfwheels
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: cfwheels
        tier: legacy-modernization
        runtime: lucee
    spec:
      serviceAccountName: cfwheels
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: cfwheels
          image: ghcr.io/bah-demo/cfwheels:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8888
              protocol: TCP
          envFrom:
            - configMapRef:
                name: cfwheels-config
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
