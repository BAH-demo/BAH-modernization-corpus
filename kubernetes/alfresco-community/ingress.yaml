---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: alfresco-community
  namespace: legacy-modernization
  labels:
    app: alfresco-community
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  tls:
    - hosts:
        - alfresco-community.legacy.gov
      secretName: alfresco-community-tls
  rules:
    - host: alfresco-community.legacy.gov
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: alfresco-community
                port:
                  name: http
