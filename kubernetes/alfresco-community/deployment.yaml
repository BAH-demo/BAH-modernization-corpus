---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alfresco-community
  namespace: legacy-modernization
  labels:
    app: alfresco-community
    tier: legacy-modernization
    runtime: java
spec:
  replicas: 2
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: alfresco-community
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: alfresco-community
        tier: legacy-modernization
        runtime: java
    spec:
      serviceAccountName: alfresco-community
      securityContext:
        runAsNonRoot: true
        fsGroup: 1000
      containers:
        - name: alfresco-community
          image: ghcr.io/bah-demo/alfresco-community:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          envFrom:
            - configMapRef:
                name: alfresco-community-config
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 60
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
