---
###############################################################################
# CI Pipeline – Umbraco CMS (.NET 8)
# System: umbraco-cms | 761K LOC | C# | 31 .csproj files (net8.0)
#
# NOTE: The source directory (modernization-corpus-aggregate/umbraco-cms) is
# populated at runtime by CORPUS-AGGREGATION-SETUP.sh and is NOT checked into
# version control. Jobs gracefully skip when the directory is absent.
###############################################################################
name: CI – Umbraco CMS (.NET 8)

on:
  push:
    branches: ["main", "devin/**"]
    paths:
      - "modernization-corpus-aggregate/umbraco-cms/**"
      - ".github/workflows/ci-umbraco-cms.yml"
      - "dockerfiles/Dockerfile.umbraco-cms"
  pull_request:
    branches: ["main", "devin/**"]
    paths:
      - "modernization-corpus-aggregate/umbraco-cms/**"
      - ".github/workflows/ci-umbraco-cms.yml"
      - "dockerfiles/Dockerfile.umbraco-cms"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  SOLUTION_PATH: modernization-corpus-aggregate/umbraco-cms

jobs:
  # ---------------------------------------------------------------------------
  # Preflight – Check if source directory exists
  # ---------------------------------------------------------------------------
  preflight:
    name: Preflight Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for source directory
        id: check
        run: |
          if [ -d "${{ env.SOLUTION_PATH }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Source directory found: ${{ env.SOLUTION_PATH }}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Source directory not present. Run CORPUS-AGGREGATION-SETUP.sh to populate."
          fi

  # ---------------------------------------------------------------------------
  # Build & Test
  # ---------------------------------------------------------------------------
  build-and-test:
    name: Build & Test (.NET 8)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: preflight
    if: needs.preflight.outputs.source_exists == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-umbraco-${{ hashFiles('**/packages.lock.json', '**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-umbraco-

      - name: Restore dependencies
        run: dotnet restore
        working-directory: ${{ env.SOLUTION_PATH }}

      - name: Build solution
        run: dotnet build --no-restore --configuration Release --verbosity minimal
        working-directory: ${{ env.SOLUTION_PATH }}

      - name: Run tests
        run: dotnet test --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage"
        working-directory: ${{ env.SOLUTION_PATH }}

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-umbraco
          path: "**/TestResults/**"
          retention-days: 30

  # ---------------------------------------------------------------------------
  # Security – SAST
  # ---------------------------------------------------------------------------
  sast:
    name: SAST – Semgrep
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: build-and-test
    if: needs.build-and-test.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep SAST scan
        uses: semgrep/semgrep-action@v1
        with:
          config: >-
            p/csharp
            p/dotnet
            p/owasp-top-ten
            p/security-audit
        env:
          SEMGREP_RULES: "p/csharp p/dotnet p/owasp-top-ten p/security-audit"

  # ---------------------------------------------------------------------------
  # Security – NuGet Vulnerability Audit
  # ---------------------------------------------------------------------------
  nuget-audit:
    name: NuGet Vulnerability Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: preflight
    if: needs.preflight.outputs.source_exists == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore and audit NuGet packages
        run: |
          dotnet restore
          dotnet list package --vulnerable --include-transitive 2>&1 | tee nuget-audit.txt
          # Fail if any critical/high vulnerabilities are detected
          if grep -qiE "(Critical|High)" nuget-audit.txt; then
            echo "::error::Critical or High NuGet vulnerabilities detected"
            exit 1
          fi
        working-directory: ${{ env.SOLUTION_PATH }}

      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nuget-audit-umbraco
          path: "**/nuget-audit.txt"
          retention-days: 30
