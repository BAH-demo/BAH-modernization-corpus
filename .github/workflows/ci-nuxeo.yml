name: CI - Nuxeo

on:
  push:
    branches: [main, "devin/**"]
    paths:
      - 'modernization-corpus-aggregate/nuxeo/**'
      - '.github/workflows/ci-nuxeo.yml'
      - 'dockerfiles/Dockerfile.nuxeo'
  pull_request:
    branches: [main, "devin/**"]
    paths:
      - 'modernization-corpus-aggregate/nuxeo/**'
      - '.github/workflows/ci-nuxeo.yml'
      - 'dockerfiles/Dockerfile.nuxeo'
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

env:
  JAVA_VERSION: '17'
  SYSTEM_NAME: nuxeo
  SYSTEM_PATH: modernization-corpus-aggregate/nuxeo

jobs:
  preflight:
    name: Preflight Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for source directory
        id: check
        run: |
          if [ -d "${{ env.SYSTEM_PATH }}" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Source directory found: ${{ env.SYSTEM_PATH }}"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Source directory not present. Run CORPUS-AGGREGATION-SETUP.sh to populate."
          fi

  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.source_exists == 'true'
    defaults:
      run:
        working-directory: ${{ env.SYSTEM_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ env.SYSTEM_NAME }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ env.SYSTEM_NAME }}-
            ${{ runner.os }}-maven-

      - name: Build with Maven (skip tests)
        run: mvn clean verify -DskipTests -B

      - name: Run unit tests
        run: mvn test -B

  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config auto --sarif --output semgrep-results.sarif ${{ env.SYSTEM_PATH }} || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-${{ env.SYSTEM_NAME }}

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ env.SYSTEM_PATH }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ env.SYSTEM_NAME }}

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build
    if: needs.build.result == 'success'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile.${{ env.SYSTEM_NAME }}
          push: false
          tags: ${{ env.SYSTEM_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
