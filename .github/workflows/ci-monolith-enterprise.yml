name: CI - Monolith Enterprise

on:
  push:
    branches: [main]
    paths:
      - 'modernization-corpus-aggregate/monolith-enterprise/**'
      - '.github/workflows/ci-monolith-enterprise.yml'
      - 'dockerfiles/Dockerfile.monolith-enterprise'
  pull_request:
    branches: [main]
    paths:
      - 'modernization-corpus-aggregate/monolith-enterprise/**'
      - '.github/workflows/ci-monolith-enterprise.yml'
      - 'dockerfiles/Dockerfile.monolith-enterprise'

permissions:
  contents: read
  security-events: write

env:
  JAVA_VERSION: '17'
  SYSTEM_NAME: monolith-enterprise
  SYSTEM_PATH: modernization-corpus-aggregate/monolith-enterprise

jobs:
  build:
    name: Build & Verify
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.SYSTEM_PATH }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ env.JAVA_VERSION }}
          distribution: temurin

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ env.SYSTEM_NAME }}-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-${{ env.SYSTEM_NAME }}-
            ${{ runner.os }}-maven-

      - name: Build with Maven (skip tests)
        run: mvn clean verify -DskipTests -B

      - name: Run unit tests
        run: mvn test -B

  sast-scan:
    name: SAST Scan (Semgrep)
    runs-on: ubuntu-latest
    needs: build
    container:
      image: semgrep/semgrep

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Semgrep
        run: semgrep scan --config auto --sarif --output semgrep-results.sarif ${{ env.SYSTEM_PATH }} || true

      - name: Upload Semgrep SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: semgrep-results.sarif
          category: semgrep-${{ env.SYSTEM_NAME }}

  dependency-check:
    name: Dependency Vulnerability Check
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: ${{ env.SYSTEM_PATH }}
          format: sarif
          output: trivy-results.sarif
          severity: CRITICAL,HIGH

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-results.sarif
          category: trivy-${{ env.SYSTEM_NAME }}

  docker-build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: dockerfiles/Dockerfile.${{ env.SYSTEM_NAME }}
          push: false
          tags: ${{ env.SYSTEM_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
