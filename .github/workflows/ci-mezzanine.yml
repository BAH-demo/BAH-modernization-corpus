###############################################################################
# CI/CD Pipeline – Mezzanine (CMS, ~64K LOC Python/Django)
# Critical imp -> importlib fix applied
###############################################################################
name: CI – Mezzanine

on:
  push:
    branches: [main, "devin/**"]
    paths:
      - "mezzanine/**"
      - "dockerfiles/Dockerfile.mezzanine"
      - ".github/workflows/ci-mezzanine.yml"
  pull_request:
    branches: [main, "devin/**"]
    paths:
      - "mezzanine/**"
      - "dockerfiles/Dockerfile.mezzanine"
      - ".github/workflows/ci-mezzanine.yml"
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  preflight:
    name: Preflight Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source_exists: ${{ steps.check.outputs.exists }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Check for source directory
        id: check
        run: |
          if [ -d "mezzanine" ]; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Source directory found: mezzanine"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Source directory not present. Run CORPUS-AGGREGATION-SETUP.sh to populate."
          fi

  lint:
    name: Lint (ruff + flake8)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.source_exists == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install linting tools
        run: pip install ruff flake8

      - name: Run ruff
        run: ruff check mezzanine/ --output-format=github

      - name: Run flake8
        run: flake8 mezzanine/ --max-line-length=120 --statistics

  typecheck:
    name: Type Check (mypy)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.source_exists == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install mypy django-stubs
          if [ -f mezzanine/requirements.txt ]; then pip install -r mezzanine/requirements.txt; fi

      - name: Run mypy (basic)
        run: mypy mezzanine/ --ignore-missing-imports --no-strict-optional || true

  test:
    name: Unit Tests (pytest)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.source_exists == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mezzanine
          POSTGRES_PASSWORD: mezzanine
          POSTGRES_DB: mezzanine_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U mezzanine"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5
    env:
      DATABASE_URL: postgres://mezzanine:mezzanine@localhost:5432/mezzanine_test
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          if [ -f mezzanine/requirements.txt ]; then pip install -r mezzanine/requirements.txt; fi
          if [ -f mezzanine/setup.py ]; then pip install -e "mezzanine/[test]" 2>/dev/null || pip install -e mezzanine/; fi
          pip install pytest pytest-django pytest-cov

      - name: Run tests
        run: pytest mezzanine/ --tb=short -q || true

  security:
    name: SAST & Dependency Audit
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.source_exists == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install security tools
        run: pip install bandit pip-audit

      - name: Run Bandit (SAST)
        run: bandit -r mezzanine/ -f json -o bandit-mezzanine-report.json --severity-level medium || true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-mezzanine-report
          path: bandit-mezzanine-report.json

      - name: Run pip-audit (dependency vulnerabilities)
        run: |
          if [ -f mezzanine/requirements.txt ]; then pip-audit -r mezzanine/requirements.txt || true; fi

  docker:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [lint, test]
    if: needs.lint.result == 'success' && needs.test.result == 'success'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Mezzanine Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: dockerfiles/Dockerfile.mezzanine
          push: false
          tags: mezzanine-modernized:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
