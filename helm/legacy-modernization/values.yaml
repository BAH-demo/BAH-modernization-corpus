# ============================================================
# Tier 3 - Legacy/Federal
# ============================================================

nastran-95:
  enabled: true
  runtime: fortran
  type: job
  image:
    repository: ghcr.io/bah-demo/nastran-95
    tag: latest
  resources:
    requests:
      cpu: 2000m
      memory: 8Gi
    limits:
      cpu: 4000m
      memory: 16Gi
  job:
    backoffLimit: 3
    activeDeadlineSeconds: 86400
    ttlSecondsAfterFinished: 604800
    inputFile: /data/input/model.dat
    outputDir: /data/output

apollo-11:
  enabled: true
  type: static-docs
  image:
    repository: nginx
    tag: 1.27-alpine
  replicaCount: 2
  service:
    port: 80
    targetPort: 8080
  container:
    port: 8080
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 256Mi
  probes:
    readiness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 10
    liveness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 15
