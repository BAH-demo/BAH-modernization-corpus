# Global configuration
global:
  namespace: legacy-modernization
  imageRegistry: ghcr.io/bah-demo
  imagePullPolicy: Always
  tlsEnabled: true
  clusterIssuer: letsencrypt-prod
  domainSuffix: legacy.gov

# ============================================================
# Tier 1 - Enterprise Monoliths (100K+ LOC)
# ============================================================

apache-ofbiz:
  enabled: true
  runtime: java
  image:
    repository: ghcr.io/bah-demo/apache-ofbiz
    tag: latest
  replicaCount: 2
  service:
    port: 80
    targetPort: 8443
  container:
    port: 8443
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 4Gi
  autoscaling:
    minReplicas: 2
    maxReplicas: 10
    targetCPUUtilization: 70
    targetMemoryUtilization: 80
  probes:
    readiness:
      path: /health
      initialDelaySeconds: 30
      periodSeconds: 10
    liveness:
      path: /health
      initialDelaySeconds: 60
      periodSeconds: 15
  ingress:
    host: apache-ofbiz.legacy.gov
  config:
    APP_ENV: production
    APP_NAME: apache-ofbiz
    LOG_LEVEL: info
    TZ: UTC
    PORT: "8443"

