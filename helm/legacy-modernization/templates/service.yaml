{{- $systems := list "apache-ofbiz" "odoo" "alfresco-community" "nuxeo" "django-oscar" "umbraco-cms" "mezzanine" "b2cweb" "dfe-net" "monolith-enterprise" "cfwheels" }}
{{- range $name := $systems }}
{{- $sys := index $.Values $name }}
{{- if $sys.enabled }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  labels:
    {{- include "legacy-modernization.labels" $ | nindent 4 }}
    app: {{ $name }}
spec:
  type: ClusterIP
  ports:
    - port: {{ $sys.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: {{ $name }}
{{- end }}
{{- end }}
