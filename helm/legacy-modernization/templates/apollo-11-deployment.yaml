{{- $sys := index .Values "apollo-11" }}
{{- if $sys.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: apollo-11
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "legacy-modernization.labels" . | nindent 4 }}
    app: apollo-11
    tier: legacy-modernization
    purpose: documentation-preservation
spec:
  replicas: {{ $sys.replicaCount }}
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app: apollo-11
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        app: apollo-11
        tier: legacy-modernization
        purpose: documentation-preservation
    spec:
      securityContext:
        runAsNonRoot: true
        fsGroup: 101
      containers:
        - name: nginx
          image: "{{ $sys.image.repository }}:{{ $sys.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ $sys.container.port }}
              protocol: TCP
          resources:
            requests:
              cpu: "{{ $sys.resources.requests.cpu }}"
              memory: "{{ $sys.resources.requests.memory }}"
            limits:
              cpu: "{{ $sys.resources.limits.cpu }}"
              memory: "{{ $sys.resources.limits.memory }}"
          readinessProbe:
            httpGet:
              path: {{ $sys.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ $sys.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ $sys.probes.readiness.periodSeconds }}
            timeoutSeconds: 3
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $sys.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ $sys.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ $sys.probes.liveness.periodSeconds }}
            timeoutSeconds: 3
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: docs-content
              mountPath: /usr/share/nginx/html
              readOnly: true
            - name: nginx-config
              mountPath: /etc/nginx/conf.d
              readOnly: true
            - name: tmp
              mountPath: /tmp
            - name: nginx-cache
              mountPath: /var/cache/nginx
            - name: nginx-run
              mountPath: /var/run
      volumes:
        - name: docs-content
          configMap:
            name: apollo-11-docs
        - name: nginx-config
          configMap:
            name: apollo-11-nginx-config
        - name: tmp
          emptyDir: {}
        - name: nginx-cache
          emptyDir: {}
        - name: nginx-run
          emptyDir: {}

---
apiVersion: v1
kind: Service
metadata:
  name: apollo-11
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "legacy-modernization.labels" . | nindent 4 }}
    app: apollo-11
spec:
  type: ClusterIP
  ports:
    - port: {{ $sys.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    app: apollo-11
{{- end }}
