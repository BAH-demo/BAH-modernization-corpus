# Spring Boot Configuration for CICS Banking Modernization
# Replaces CICS region configuration and VSAM file definitions

spring.application.name=cics-banking-modernized

# H2 Database (replaces VSAM file I/O)
spring.datasource.url=jdbc:h2:mem:bankingdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true

# Server configuration
server.port=8080
